<h1>出售与出租房源</h1>
<p class="listing-location">新山 · 古来 · 柔佛周边地区</p>
<p class="hero-copy">可按关键词、类别、地区、房屋类型和价格搜索精选的二手屋和出租房源。</p>

<section class="section">
<div class="container">

<!-- ==================== PROPERTY SEARCH ====================
     【以后新增筛选条件时需要修改】
     搜索资料来自 data/properties.json，程序在 js/ 的分层架构里（见 ARCHITECTURE.md）。
     Area 和 Property Type 的选项由 JSON 自动产生，这里只保留第一个 "All" 选项。
     如果增加新的筛选类别，需要同时修改：
     1. 这里的 HTML select / input（加上 data-filter="名称"）
     2. js/service/propertyService.js 的 DEFAULT_QUERY + matchesQuery()
     3. js/ui/propertyListPage.js 的 FILTERS
     ========================================================= -->
<div class="property-search">
  <div class="search-main">
    <label for="propertySearch">搜索房源</label>
    <input type="search" id="propertySearch" data-filter="keyword" placeholder="搜索地点、房源名称……" autocomplete="off">
  </div>

  <div class="search-filters">
    <div>
      <label for="listingType">类别</label>
      <select id="listingType" data-filter="listingType">
        <option value="">全部</option>
        <option value="sale">出售</option>
        <option value="rent">出租</option>
      </select>
    </div>

    <div>
      <label for="locationFilter">地区</label>
      <select id="locationFilter" data-filter="area">
        <option value="">所有地区</option>
      </select>
    </div>

    <div>
      <label for="propertyType">房屋类型</label>
      <select id="propertyType" data-filter="propertyType">
        <option value="">所有类型</option>
      </select>
    </div>

    <div>
      <label for="minPrice">最低价格</label>
      <input type="number" id="minPrice" data-filter="minPrice" min="0" step="10000" placeholder="RM">
    </div>

    <div>
      <label for="maxPrice">最高价格</label>
      <input type="number" id="maxPrice" data-filter="maxPrice" min="0" step="10000" placeholder="RM">
    </div>

    <button class="button secondary search-reset" type="button" id="resetFilters" data-property-reset>重置</button>
  </div>
</div>

<div class="search-summary">
  <span id="resultCount" data-property-count>正在加载房源……</span>
  <div class="search-sort">
    <label for="sortBy">排序</label>
    <select id="sortBy" data-filter="sort">
      <option value="newest">最新</option>
      <option value="price-asc">价格：从低到高</option>
      <option value="price-desc">价格：从高到低</option>
      <option value="bedrooms-desc">房间数：从多到少</option>
      <option value="bedrooms-asc">房间数：从少到多</option>
    </select>
  </div>
</div>

<div class="property-grid" id="propertyGrid" data-property-results></div>

<div class="no-results" id="noResults" data-property-empty hidden>
  <h2>找不到房源</h2>
  <p>请尝试更改搜索条件或筛选项。</p>
</div>

</div>
</section>
